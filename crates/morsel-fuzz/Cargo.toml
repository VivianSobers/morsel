[package]
name = "morsel-fuzz"
version = "0.1.0"
edition = "2021"

[lib]
name = "morsel_fuzz"
path = "src/lib.rs"

[[bin]]
name = "morsel-fuzz"
path = "src/main.rs"

[dependencies]
morsel-core = { path = "../morsel-core" }
morsel-plan = { path = "../morsel-plan" }
morsel-exec = { path = "../morsel-exec" }
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
